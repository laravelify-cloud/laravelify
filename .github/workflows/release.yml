name: Release

# Push a tag to publish a release:
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
#
# The release gets laravelify.tar.gz (the panel with built assets, without vendor)
# and install.sh. install.sh is also uploaded to DigitalOcean Spaces, so
#   curl -fsSL https://cdn.laravelify.cloud/install.sh | sudo bash
# always installs the latest release.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SPACES_ACCESS_KEY_ID       Spaces access key
#   SPACES_SECRET_ACCESS_KEY   Spaces secret key
#   SPACES_REGION              fra1
#   SPACES_BUCKET              cdn.laravelify.cloud
# Optional, to clear the CDN cache right away instead of within 5 minutes:
#   DIGITALOCEAN_TOKEN         API token with CDN write access
#   SPACES_CDN_ID              the CDN endpoint ID (doctl compute cdn list)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
      SPACES_REGION: ${{ secrets.SPACES_REGION }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_CDN_ID: ${{ secrets.SPACES_CDN_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Stamp version and repository
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          # The scripts and config ship with a placeholder; point them at this repository.
          sed -i "s#YOUR-GITHUB-USER/laravelify#${GITHUB_REPOSITORY}#g" scripts/install.sh scripts/update.sh config/laravelify.php
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/laravelify.tar.gz \
            --exclude=./node_modules \
            --exclude=./vendor \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./dist \
            --exclude=./brand \
            --exclude=./tests \
            --exclude=./.claude \
            --exclude=./.cursor \
            --exclude=./.junie \
            --exclude=./CLAUDE.md \
            --exclude=./AGENTS.md \
            --exclude=./boost.json \
            --exclude=./.env \
            --exclude=./.phpunit.result.cache \
            --exclude='./database/*.sqlite' \
            --exclude='./storage/logs/*.log' \
            --transform 's,^\.,laravelify,' \
            .
          cp scripts/install.sh dist/install.sh
          ls -lh dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/laravelify.tar.gz
            dist/install.sh
          generate_release_notes: true
          # Beta tags (v0.1.0-beta.1) are published as normal releases on purpose:
          # the installer downloads /releases/latest, which skips pre-releases.
          prerelease: false
          make_latest: true

      - name: Upload install.sh to DigitalOcean Spaces
        if: env.SPACES_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          ENDPOINT="https://${SPACES_REGION}.digitaloceanspaces.com"
          # The bucket name has dots, which break virtual-hosted HTTPS; use path-style requests.
          aws configure set default.s3.addressing_style path
          aws s3 cp dist/install.sh "s3://${SPACES_BUCKET}/install.sh" \
            --endpoint-url "$ENDPOINT" \
            --acl public-read \
            --content-type 'text/x-shellscript; charset=utf-8' \
            --cache-control 'public, max-age=300'
          aws s3 cp dist/install.sh "s3://${SPACES_BUCKET}/releases/v${VERSION}/install.sh" \
            --endpoint-url "$ENDPOINT" \
            --acl public-read \
            --content-type 'text/x-shellscript; charset=utf-8'
          echo "Uploaded: https://${SPACES_BUCKET}/install.sh"

      - name: Clear the CDN cache
        if: env.SPACES_BUCKET != '' && env.DIGITALOCEAN_TOKEN != '' && env.SPACES_CDN_ID != ''
        run: |
          curl -fsS -X DELETE "https://api.digitalocean.com/v2/cdn/endpoints/${SPACES_CDN_ID}/cache" \
            -H "Authorization: Bearer ${DIGITALOCEAN_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"files":["install.sh","releases/*"]}'
